[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchlog"
version = "0.1.0"
description = "Version control for breadboard prototypes"
readme = "README.md"
requires-python = ">=3.11"
# Core stays light: CI only needs the model, diff and checks.
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
serial = ["pyserial>=3.5"]
vision = ["opencv-contrib-python>=4.10", "numpy>=1.26"]
dev = ["pytest>=8", "httpx>=0.27"]
all = ["benchlog[server,serial,vision,dev]"]

[project.scripts]
benchlog = "benchlog.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/benchlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
