<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>benchlog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e1117;
      color: #e2e8f0;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid #1e2a3a;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 17px; font-weight: 600; color: #7dd3fc; letter-spacing: 0.05em; text-shadow: 0 0 20px rgba(125,211,252,0.4); }
    #branch-label {
      background: #1e3a5f;
      color: #7dd3fc;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
    }
    #status-badge {
      margin-left: auto;
      font-size: 11px;
      color: #64748b;
    }

    #main {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0;
    }

    #board-wrapper {
      padding: 20px 20px 8px;
      overflow-x: auto;
      box-shadow: 0 0 40px rgba(34,197,94,0.07);
      border: 1px solid #1a3d20;
      border-radius: 8px;
      margin: 8px 12px 0;
    }

    #board-svg {
      display: block;
      border-radius: 8px;
      overflow: visible;
    }

    @keyframes board-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .board-fade { animation: board-fade-in 0.12s ease; }

    @keyframes diff-pulse {
      0%, 100% { opacity: 0.9; }
      50%       { opacity: 0.3; }
    }
    .diff-added-ring   { animation: diff-pulse 1.8s infinite; }
    .diff-removed-ring { animation: diff-pulse 1.8s infinite; }

    /* ── hazard banner ──────────────────────────────────────────── */
    #hazard-banner {
      display: none;
      background: #f59e0b;
      color: #1c0f00;
      padding: 7px 20px;
      font-size: 12px;
      font-weight: 600;
      border-left: 4px solid #d97706;
      width: 100%;
      margin: 0;
    }
    #hazard-banner.visible { display: block; }

    /* ── timeline ────────────────────────────────────────────────── */
    #timeline-section {
      padding: 12px 20px 16px;
      border-top: 1px solid #1e2a3a;
    }

    #hero-label {
      color: #475569;
      font-size: 11px;
      text-align: center;
      margin-bottom: 10px;
    }

    #timeline-track {
      position: relative;
      margin-bottom: 10px;
    }

    #timeline-commits {
      display: flex;
      position: absolute;
      top: -4px;
      left: 0;
      right: 0;
      pointer-events: none;
    }

    .commit-pip {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 50%;
      transform: translateX(-50%);
      transition: background 0.15s;
    }
    .commit-pip.active { background: #7dd3fc; border-color: #7dd3fc; }
    .commit-pip.has-electrical { background: #f59e0b; border-color: #f59e0b; }
    .commit-pip.active.has-electrical { background: #f59e0b; }

    input[type=range] {
      width: 100%;
      height: 4px;
      appearance: none;
      background: #1e2a3a;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      background: #7dd3fc;
      border-radius: 50%;
      cursor: pointer;
    }

    #timeline-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      background: #1e2a3a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }
    button:hover { background: #273548; }
    button:disabled { opacity: 0.35; cursor: default; }
    #play-btn { min-width: 36px; }

    #snapshot-counter { color: #64748b; font-size: 11px; min-width: 50px; }

    #speed-label { color: #64748b; font-size: 11px; }
    #speed-select {
      background: #1e2a3a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
    }

    #kbd-hint { color: #475569; font-size: 10px; margin-left: auto; }

    /* ── commit info panel ───────────────────────────────────── */
    #info-panel {
      padding: 10px 20px 16px;
      border-top: 1px solid #1e2a3a;
      border-left: 3px solid #1e3a5f;
      min-height: 80px;
      transition: border-left-color 0.2s;
    }
    #info-panel.electrical { border-left-color: #f59e0b; }

    #commit-message {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    #commit-meta {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 8px;
    }

    #diff-lines {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    #diff-lines li {
      background: #1e2a3a;
      border: 1px solid #334155;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      color: #94a3b8;
    }

    #diff-lines li.electrical {
      border-color: #f59e0b44;
      background: #1c1a0e;
      color: #fbbf24;
    }

    #empty-state {
      color: #475569;
      font-size: 12px;
      padding: 20px;
      text-align: center;
    }

    /* ── legend ──────────────────────────────────────────────── */
    #legend {
      display: flex;
      gap: 16px;
      padding: 6px 20px;
      border-top: 1px solid #1e2a3a;
      flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #64748b; }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
      border: 1.5px solid transparent;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>benchlog</h1>
  <span id="branch-label">–</span>
  <span id="status-badge">loading…</span>
</header>

<div id="main">
  <div id="board-wrapper">
    <svg id="board-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div id="hazard-banner">⚡ Electrical change — check connections before flashing</div>

  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6;border-color:#3b82f6"></div> ESP32</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d97706;border-color:#d97706"></div> pot / resistor</div>
    <div class="legend-item"><div class="legend-dot" style="background:#eab308;border-color:#eab308"></div> LED</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e5e7eb;border-color:#e5e7eb"></div> wire</div>
    <div class="legend-item"><div class="legend-dot" style="background:transparent;border-color:#22c55e"></div> added</div>
    <div class="legend-item"><div class="legend-dot" style="background:transparent;border-color:#ef4444"></div> removed</div>
  </div>

  <div id="timeline-section">
    <p id="hero-label">scrub or press space to replay commit history</p>
    <div id="timeline-track">
      <div id="timeline-commits"></div>
      <input id="slider" type="range" min="0" max="0" value="0">
    </div>
    <div id="timeline-controls">
      <button id="prev-btn" title="Previous commit">◀</button>
      <button id="play-btn" title="Play/pause">▶</button>
      <button id="next-btn" title="Next commit">⏭</button>
      <span id="snapshot-counter">– / –</span>
      <span id="speed-label">speed</span>
      <select id="speed-select">
        <option value="2000">0.5×</option>
        <option value="1200" selected>1×</option>
        <option value="600">2×</option>
        <option value="300">4×</option>
      </select>
      <span id="kbd-hint">← → step · space play</span>
    </div>
  </div>

  <div id="info-panel">
    <div id="commit-message">–</div>
    <div id="commit-meta"></div>
    <ul id="diff-lines"></ul>
  </div>
</div>

<script>
// ── Board geometry ──────────────────────────────────────────────────────────────

const PITCH     = 18;   // px between holes
const HOLE_R    = 4.5;  // hole circle radius
const MX        = 36;   // left/right margin
const MY        = 24;   // top/bottom margin
const N_ROWS    = 40;   // terminal rows (1..40) — demo uses up to row 22
const RAIL_LEN  = 50;   // rail holes (1..50)
const RAIL_OFF  = 7;    // rail holes start at terminal row offset (center rail under terminal)

// Y slot for each column/rail (relative units, multiplied by PITCH)
const COL_Y = {
  'L+': 0, 'L-': 1,
  'A': 2.9, 'B': 3.9, 'C': 4.9, 'D': 5.9, 'E': 6.9,
  'F': 8.4, 'G': 9.4, 'H': 10.4, 'I': 11.4, 'J': 12.4,
  'R+': 14.3, 'R-': 15.3,
};
const MAX_Y_SLOT = 15.3;
const SVG_W = MX * 2 + N_ROWS * PITCH;
const SVG_H = MY * 2 + MAX_Y_SLOT * PITCH + HOLE_R * 2;

function holeXY(hole) {
  const tm = hole.match(/^([A-J])(\d+)$/);
  if (tm) {
    const row = parseInt(tm[2]);
    if (row < 1 || row > N_ROWS) return null;
    return { x: MX + (row - 1) * PITCH, y: MY + COL_Y[tm[1]] * PITCH };
  }
  const rm = hole.match(/^([LR][+-])(\d+)$/);
  if (rm) {
    const idx = parseInt(rm[2]);
    if (idx < 1 || idx > RAIL_LEN) return null;
    return { x: MX + (RAIL_OFF + idx - 1) * PITCH, y: MY + COL_Y[rm[1]] * PITCH };
  }
  return null;
}

// ── Circuit → render info ────────────────────────────────────────────────────

const COMP_COLOR = {
  esp32_devkit_v1_30: '#3b82f6',
  resistor:           '#d97706',
  potentiometer:      '#d97706',
  led:                '#eab308',
};

function circuitHoles(circuit) {
  const holes = new Map(); // hole → { kind, color, label }

  for (const comp of circuit.components || []) {
    const color = COMP_COLOR[comp.type] || '#94a3b8';
    for (const [pin, hole] of Object.entries(comp.pins || {})) {
      holes.set(hole, { kind: 'component', color, label: `${comp.id}.${pin}` });
    }
  }
  for (const wire of circuit.wires || []) {
    const color = wire.color || wireHue(wire.id);
    for (const h of [wire.a, wire.b]) {
      if (!holes.has(h)) holes.set(h, { kind: 'wire', color, label: wire.label || wire.id });
    }
  }
  return holes;
}

function wireHue(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
  return `hsl(${(h * 137) % 360},65%,60%)`;
}

function diffHoles(prevCircuit, currCircuit) {
  const prev = circuitHoles(prevCircuit || { components: [], wires: [] });
  const curr = circuitHoles(currCircuit || { components: [], wires: [] });
  const added   = new Set([...curr.keys()].filter(h => !prev.has(h)));
  const removed = new Set([...prev.keys()].filter(h => !curr.has(h)));
  return { added, removed };
}

// ── SVG rendering ─────────────────────────────────────────────────────────────

function makeSVG(circuit, prevCircuit) {
  const svg = document.getElementById('board-svg');
  svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
  svg.setAttribute('width', SVG_W);
  svg.setAttribute('height', SVG_H);

  // fade transition
  svg.classList.remove('board-fade');
  svg.innerHTML = '';
  void svg.offsetWidth; // force reflow so animation re-triggers
  svg.classList.add('board-fade');

  const ns = 'http://www.w3.org/2000/svg';
  const g = (tag, attrs, parent) => {
    const el = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    (parent || svg).appendChild(el);
    return el;
  };

  // ── background ──
  g('rect', { x: 0, y: 0, width: SVG_W, height: SVG_H, fill: '#0e1117', rx: 8 });

  // board body
  const boardX = MX - PITCH * 0.7;
  const boardY = MY + COL_Y['A'] * PITCH - PITCH * 0.65;
  const boardW = N_ROWS * PITCH + PITCH * 1.4;
  const boardH = (COL_Y['J'] - COL_Y['A']) * PITCH + PITCH * 1.3;
  g('rect', { x: boardX, y: boardY, width: boardW, height: boardH, fill: '#1a3d20', rx: 4 });

  // rail backgrounds + power rail tints
  for (const [rail, rOff] of [['L+','L-'], ['R+','R-']]) {
    const y1 = MY + COL_Y[rail] * PITCH - PITCH * 0.55;
    const rh = PITCH * 1.6 + PITCH * 0.3;  // two rows + gap
    const railX = MX + RAIL_OFF * PITCH - PITCH * 0.7;
    const railW = RAIL_LEN * PITCH + PITCH * 0.4;
    g('rect', { x: railX, y: y1, width: railW, height: rh, fill: '#141f14', rx: 3 });
    // faint color tints: red for + rail, blue for - rail
    const rowH = PITCH * 0.95;
    const yPlus  = MY + COL_Y[rail] * PITCH - rowH * 0.5;
    const yMinus = MY + COL_Y[rOff] * PITCH - rowH * 0.5;
    g('rect', { x: railX, y: yPlus,  width: railW, height: rowH, fill: 'rgba(220,38,38,0.09)', rx: 2 });
    g('rect', { x: railX, y: yMinus, width: railW, height: rowH, fill: 'rgba(59,130,246,0.09)', rx: 2 });
  }

  // center divider
  const divY = MY + ((COL_Y['E'] + COL_Y['F']) / 2) * PITCH;
  g('line', { x1: boardX + 4, y1: divY, x2: boardX + boardW - 4, y2: divY, stroke: '#0e1117', 'stroke-width': 3 });

  // column labels
  const labelCols = ['A','B','C','D','E','F','G','H','I','J'];
  for (const col of labelCols) {
    const y = MY + COL_Y[col] * PITCH;
    g('text', { x: MX - PITCH * 0.45, y: y + 4, fill: '#334155', 'font-size': 8, 'text-anchor': 'end', 'font-family': 'monospace' }).textContent = col;
  }
  // rail labels
  for (const rail of ['L+','L-','R+','R-']) {
    const y = MY + COL_Y[rail] * PITCH;
    g('text', { x: MX - PITCH * 0.45, y: y + 4, fill: rail.includes('+') ? '#7f3f3f' : '#3f3f7f', 'font-size': 8, 'text-anchor': 'end', 'font-family': 'monospace' }).textContent = rail;
  }

  // row numbers (every 5)
  for (let row = 5; row <= N_ROWS; row += 5) {
    const x = MX + (row - 1) * PITCH;
    g('text', { x, y: boardY - 3, fill: '#1e3a2a', 'font-size': 8, 'text-anchor': 'middle', 'font-family': 'monospace' }).textContent = row;
    g('text', { x, y: boardY + boardH + 10, fill: '#1e3a2a', 'font-size': 8, 'text-anchor': 'middle', 'font-family': 'monospace' }).textContent = row;
  }

  // compute diff sets before wires so wire labels can use them
  const { added, removed } = diffHoles(prevCircuit, circuit);

  // ── wires ──
  for (const wire of (circuit.wires || [])) {
    const pa = holeXY(wire.a);
    const pb = holeXY(wire.b);
    if (!pa || !pb) continue;
    const color = wire.color || wireHue(wire.id);
    // draw wire as a path with a slight curve
    const mx2 = (pa.x + pb.x) / 2;
    const my2 = (pa.y + pb.y) / 2 - Math.abs(pa.x - pb.x) * 0.08;
    g('path', {
      d: `M ${pa.x} ${pa.y} Q ${mx2} ${my2} ${pb.x} ${pb.y}`,
      stroke: color, 'stroke-width': 2.5, fill: 'none', opacity: 0.75,
      'stroke-linecap': 'round',
    });
    // floating label for wires with an endpoint in the added set
    if (added.has(wire.a) || added.has(wire.b)) {
      const labelText = wire.label || wire.id;
      const lx = mx2;
      const ly = my2 - 8;
      const textW = Math.max(labelText.length * 5.8, 28);
      const labelGroup = g('g', {});
      g('rect', { x: lx - textW / 2 - 2, y: ly - 10, width: textW + 4, height: 14, fill: '#0e1117', rx: 2, opacity: 0.85 }, labelGroup);
      g('text', { x: lx, y: ly, 'font-size': 10, fill: '#f8fafc', 'text-anchor': 'middle', 'font-family': 'monospace' }, labelGroup).textContent = labelText;
    }
  }

  // ── diff ghost holes (removed) ──
  const prevHoles = circuitHoles(prevCircuit || { components: [], wires: [] });
  for (const hole of removed) {
    const p = holeXY(hole);
    if (!p) continue;
    g('circle', { cx: p.x, cy: p.y, r: HOLE_R + 3.5, fill: 'none', stroke: '#ef4444', 'stroke-width': 1.5, opacity: 0.8, class: 'diff-removed-ring' });
    g('circle', { cx: p.x, cy: p.y, r: HOLE_R, fill: '#3f0e0e', stroke: '#ef4444', 'stroke-width': 1 });
  }

  // ── all holes (empty + occupied) ──
  const holes = circuitHoles(circuit);

  // draw all possible holes as empty first
  for (const [colKey, ySlot] of Object.entries(COL_Y)) {
    const isRail = colKey.includes('+') || colKey.includes('-');
    const count  = isRail ? RAIL_LEN : N_ROWS;
    const startX = isRail ? MX + RAIL_OFF * PITCH : MX;
    for (let i = 0; i < count; i++) {
      const x = startX + i * PITCH;
      if (x >= SVG_W) continue; // don't render off-screen holes
      const hname = `${colKey}${i + 1}`;
      if (holes.has(hname)) continue; // will draw below
      if (removed.has(hname)) continue; // already drawn as ghost
      const y = MY + ySlot * PITCH;
      g('circle', { cx: x, cy: y, r: HOLE_R, fill: '#0d2010', stroke: '#1a3d20', 'stroke-width': 0.5 });
    }
  }

  // draw occupied holes
  for (const [hole, info] of holes) {
    const p = holeXY(hole);
    if (!p) continue;
    // pulsing glow ring for added holes
    if (added.has(hole)) {
      g('circle', { cx: p.x, cy: p.y, r: HOLE_R + 4, fill: '#22c55e22', stroke: '#22c55e', 'stroke-width': 1.5, opacity: 0.9, class: 'diff-added-ring' });
    }
    g('circle', { cx: p.x, cy: p.y, r: HOLE_R, fill: info.color, stroke: '#0e1117', 'stroke-width': 0.8 });
    // dim inner dot
    g('circle', { cx: p.x - 1, cy: p.y - 1, r: HOLE_R * 0.35, fill: 'rgba(255,255,255,0.18)' });
  }

  // ── tooltips (title on hover) ──
  for (const [hole, info] of holes) {
    const p = holeXY(hole);
    if (!p) continue;
    const hit = g('circle', { cx: p.x, cy: p.y, r: HOLE_R + 2, fill: 'transparent', cursor: 'crosshair' });
    const t = document.createElementNS(ns, 'title');
    t.textContent = `${hole} — ${info.label}`;
    hit.appendChild(t);
  }
}

// ── Data layer ─────────────────────────────────────────────────────────────────

const circuitCache = new Map();

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}

async function getCircuit(sha) {
  if (!circuitCache.has(sha)) {
    const url = sha === '__working__' ? '/api/circuit' : `/api/circuit/${sha}`;
    circuitCache.set(sha, await fetchJSON(url));
  }
  return circuitCache.get(sha);
}

// ── Demo data (inline fallback when server is not running) ────────────────────

const DEMO_EMPTY = { schema_version: 1, board: 'bb830', components: [], wires: [] };

const DEMO_WORKING = {"board":"bb830","components":[{"id":"esp32","model":"DOIT ESP32 DevKit V1","pins":{"3V3":"I15","EN":"B1","GND1":"B13","GND2":"I14","GPIO1":"I3","GPIO12":"B12","GPIO13":"B14","GPIO14":"B11","GPIO15":"I13","GPIO16":"I10","GPIO17":"I9","GPIO18":"I7","GPIO19":"I6","GPIO2":"I12","GPIO21":"I5","GPIO22":"I2","GPIO23":"I1","GPIO25":"B8","GPIO26":"B9","GPIO27":"B10","GPIO3":"I4","GPIO32":"B6","GPIO33":"B7","GPIO34":"B4","GPIO35":"B5","GPIO36":"B2","GPIO39":"B3","GPIO4":"I11","GPIO5":"I8","VIN":"B15"},"type":"esp32_devkit_v1_30"},{"id":"led1","pins":{"anode":"E18","cathode":"F18"},"type":"led","value":"red"},{"id":"pot1","pins":{"1":"H20","3":"H22","wiper":"H21"},"type":"potentiometer","value":"10kΩ"},{"id":"r1","pins":{"1":"A14","2":"A18"},"type":"resistor","value":"220Ω"}],"schema_version":1,"wires":[{"a":"J15","b":"R+15","color":"red","id":"w1","label":"3V3 to + rail"},{"a":"J14","b":"R-14","color":"black","id":"w2","label":"GND to - rail"},{"a":"J20","b":"R+20","color":"red","id":"w3","label":"pot high"},{"a":"J22","b":"R-22","color":"black","id":"w4","label":"pot low"},{"a":"F21","b":"A4","color":"yellow","id":"w5","label":"pot signal"},{"a":"J18","b":"R-18","color":"black","id":"w6","label":"LED ground"}]};

const DEMO_MOVED = JSON.parse(JSON.stringify(DEMO_WORKING));
DEMO_MOVED.wires.find(w => w.id === 'w5').b = 'A12';
DEMO_MOVED.wires.find(w => w.id === 'w5').label = 'pot signal ⚠ strapping pin!';

const DEMO_SNAPSHOTS = [
  { sha: 'd1', message: 'feat(circuit): initial pot+LED demo circuit', ts: new Date(Date.now() - 3600000).toISOString(), author: 'team', diffLines: ['esp32 added (B1, B2, …)', 'pot1 added', 'r1 added', 'led1 added', 'w1–w6 added'], electrical: false },
  { sha: 'd2', message: 'fix(wire): move w5 to GPIO12 (strapping pin — bad!)', ts: new Date(Date.now() - 1800000).toISOString(), author: 'team', diffLines: ['w5 moved: b A4 → A12 (electrical change)', 'esp32.GPIO34 disconnected from pot1.wiper', 'esp32.GPIO12 connected to pot1.wiper'], electrical: true },
];
circuitCache.set('d1', DEMO_WORKING);
circuitCache.set('d2', DEMO_MOVED);

// ── State & UI ─────────────────────────────────────────────────────────────────

let snapshots  = [];
let currentIdx = 0;
let playTimer  = null;
let demoMode   = false;

const slider    = document.getElementById('slider');
const prevBtn   = document.getElementById('prev-btn');
const nextBtn   = document.getElementById('next-btn');
const playBtn   = document.getElementById('play-btn');
const speedSel  = document.getElementById('speed-select');
const counter   = document.getElementById('snapshot-counter');
const msgEl     = document.getElementById('commit-message');
const metaEl    = document.getElementById('commit-meta');
const diffEl    = document.getElementById('diff-lines');
const pipsEl    = document.getElementById('timeline-commits');
const branchEl  = document.getElementById('branch-label');
const statusEl  = document.getElementById('status-badge');
const hazardEl  = document.getElementById('hazard-banner');
const infoPanel = document.getElementById('info-panel');

function buildPips() {
  pipsEl.innerHTML = '';
  if (snapshots.length < 2) return;
  snapshots.forEach((s, i) => {
    const pip = document.createElement('div');
    pip.className = 'commit-pip' + (s.electrical ? ' has-electrical' : '');
    pip.style.left = `${(i / (snapshots.length - 1)) * 100}%`;
    pip.title = s.message;
    pipsEl.appendChild(pip);
  });
}

function updatePips() {
  const pips = pipsEl.querySelectorAll('.commit-pip');
  pips.forEach((p, i) => p.classList.toggle('active', i === currentIdx));
}

async function goTo(idx) {
  currentIdx = Math.max(0, Math.min(snapshots.length - 1, idx));
  slider.value = currentIdx;
  counter.textContent = `${currentIdx + 1} / ${snapshots.length}`;
  prevBtn.disabled = currentIdx === 0;
  nextBtn.disabled = currentIdx === snapshots.length - 1;
  updatePips();

  const snap = snapshots[currentIdx];
  msgEl.textContent = snap.message;
  const d = new Date(snap.ts);
  metaEl.textContent = `${snap.sha.slice(0, 7)}  ·  ${snap.author}  ·  ${d.toLocaleString()}${demoMode ? '  [demo]' : ''}`;

  // hazard banner + info panel electrical class
  hazardEl.classList.toggle('visible', !!snap.electrical);
  infoPanel.classList.toggle('electrical', !!snap.electrical);

  diffEl.innerHTML = '';
  for (const line of snap.diffLines) {
    const li = document.createElement('li');
    let text = line;
    if (snap.electrical && (line.includes('connected') || line.includes('disconnected'))) {
      li.classList.add('electrical');
      text = '⚡ ' + text;
    }
    li.textContent = text;
    diffEl.appendChild(li);
  }

  const [circuit, prevCircuit] = await Promise.all([
    getCircuit(snap.sha),
    currentIdx > 0 ? getCircuit(snapshots[currentIdx - 1].sha) : Promise.resolve(null),
  ]);
  makeSVG(circuit, prevCircuit);
}

function togglePlay() {
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
    playBtn.textContent = '▶';
  } else {
    playBtn.textContent = '⏸';
    const step = () => {
      if (currentIdx >= snapshots.length - 1) {
        goTo(0);
      } else {
        goTo(currentIdx + 1);
      }
    };
    playTimer = setInterval(step, parseInt(speedSel.value));
  }
}

slider.addEventListener('input', () => goTo(parseInt(slider.value)));
prevBtn.addEventListener('click', () => goTo(currentIdx - 1));
nextBtn.addEventListener('click', () => goTo(currentIdx + 1));
playBtn.addEventListener('click', togglePlay);
speedSel.addEventListener('change', () => {
  if (playTimer) { togglePlay(); togglePlay(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  goTo(currentIdx - 1);
  if (e.key === 'ArrowRight') goTo(currentIdx + 1);
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});

// ── Boot ───────────────────────────────────────────────────────────────────────

async function init() {
  // try to get branch name from status
  try {
    const status = await fetchJSON('/api/status');
    branchEl.textContent = status.branch || 'main';
  } catch {
    branchEl.textContent = 'demo';
  }

  // try live history
  try {
    const history = await fetchJSON('/api/history');
    if (history.length === 0) throw new Error('no commits yet');

    snapshots = history.map(e => ({
      sha:       e.commit.sha,
      message:   e.commit.message,
      ts:        e.commit.ts,
      author:    e.commit.author || '',
      diffLines: e.lines || [],
      electrical: (e.lines || []).some(l => l.includes('connected') || l.includes('disconnected')),
    }));
    statusEl.textContent = `${snapshots.length} commit${snapshots.length === 1 ? '' : 's'}`;
  } catch {
    // fall back to demo
    demoMode = true;
    snapshots = DEMO_SNAPSHOTS;
    statusEl.textContent = 'demo mode';
  }

  slider.max = snapshots.length - 1;
  buildPips();
  await goTo(0);
}

init().catch(console.error);
</script>
</body>
</html>
