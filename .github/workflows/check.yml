name: benchlog

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Core only: no OpenCV or FastAPI needed in CI.
      - run: pip install -e ".[dev]"
      - run: pytest
